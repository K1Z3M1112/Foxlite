name: Build Native Win Runtime v0.6

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.30.5"

      # Runtime assets (rootfs, box64, dxvk/vkd3d, GPU drivers, wine
      # components) are committed directly under app/src/main/assets/runtime
      # in this repo, so there is no download-from-Winlator-release step
      # here anymore. This job only builds the app around them.
      - name: Verify bundled runtime assets are present
        run: |
          test -d app/src/main/assets/runtime
          test -f app/src/main/assets/runtime/rootfs.tzst
          test -f app/src/main/assets/runtime/box64/box64-0.4.0.tzst
          echo "Runtime asset count:"
          find app/src/main/assets/runtime -type f | wc -l

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NativeWinRuntime-v0.6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
